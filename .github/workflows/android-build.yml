name: Android cloud build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build creates a candidate; verify-base only restores a trusted existing APK'
        type: choice
        options: [build, verify-base]
        default: build
        required: true
      base_build_run_id:
        description: 'Successful main build supplying the immutable base APK (verify-base only)'
        required: false
      base_sha256:
        description: 'Reviewed base APK SHA-256 (verify-base only)'
        required: false
      runtime_tests:
        description: 'Run the isolated TOWN-02 APK and covering-upgrade gate'
        type: boolean
        default: true
        required: true
      version_code:
        description: 'New APK versionCode (must exceed the published version)'
        required: true
        default: '22'
      version_name:
        description: 'APK versionName'
        required: true
        default: '0.8.2-ci-release'
permissions:
  contents: read
  actions: read
concurrency:
  group: fengshen-cloud-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'build'
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      reviewed_base_run_id: ${{ steps.content_base.outputs.run_id }}
      reviewed_upgrade_run_id: ${{ steps.content_base.outputs.upgrade_run_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact SDK components
        run: |
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'Android SDK installation failed'}
      - name: Prepare the existing scoped exporter dependency
        run: |
          python -m pip install Pillow==11.3.0
          if($LASTEXITCODE -ne 0){throw 'Exporter dependency unavailable'}
      - name: Read the reviewed immutable base pin
        id: content_base
        run: |
          $base=(Get-Content ci/content-source.json -Raw|ConvertFrom-Json).iteration.base
          if(-not $base.buildRunId){throw 'Reviewed base build run is required'}
          "run_id=$($base.buildRunId)"|Add-Content $env:GITHUB_OUTPUT
          $runtime=(Get-Content ci/content-source.json -Raw|ConvertFrom-Json).runtimeBaseline
          $upgradeRun=if($runtime){$runtime.buildRunId}else{$base.buildRunId}
          "upgrade_run_id=$upgradeRun"|Add-Content $env:GITHUB_OUTPUT
          $golden=(Get-Content ci/golden-nanhai-content.json -Raw|ConvertFrom-Json).iteration.base
          "golden_run_id=$($golden.buildRunId)"|Add-Content $env:GITHUB_OUTPUT
          $worldGolden=(Get-Content ci/golden-world-f0-content.json -Raw|ConvertFrom-Json).iteration.base
          "world_golden_run_id=$($worldGolden.buildRunId)"|Add-Content $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-signed-apk
          path: artifacts/content-base
          run-id: ${{ steps.content_base.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Retain the fixed historical Nanhai golden input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fengshen-signed-apk
          path: artifacts/golden-base
          run-id: ${{ steps.content_base.outputs.golden_run_id }}
          github-token: ${{ github.token }}
      - name: Retain the fixed historical world fault regression input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fengshen-signed-apk
          path: artifacts/world-golden-base
          run-id: ${{ steps.content_base.outputs.world_golden_run_id }}
          github-token: ${{ github.token }}
      - name: Build, test and verify existing signature/content
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          FENGSHEN_KEYSTORE_BASE64: ${{ secrets.FENGSHEN_KEYSTORE_BASE64 }}
          FENGSHEN_KEYSTORE_PASSWORD: ${{ secrets.FENGSHEN_KEYSTORE_PASSWORD }}
          FENGSHEN_KEY_ALIAS: ${{ secrets.FENGSHEN_KEY_ALIAS }}
          FENGSHEN_KEY_PASSWORD: ${{ secrets.FENGSHEN_KEY_PASSWORD }}
        run: |
          $base=@(Get-ChildItem artifacts/content-base/*-release.apk)
          if($base.Count -ne 1){throw 'Exactly one immutable base APK is required'}
          $pin=(Get-Content ci/content-source.json -Raw|ConvertFrom-Json).iteration.base
          if((Get-FileHash $base[0].FullName).Hash.ToLowerInvariant() -ne $pin.apkSha256){throw 'Immutable base APK hash differs'}
          $baseReceipt=Get-Content artifacts/content-base/apk-receipt.json -Raw|ConvertFrom-Json
          if($baseReceipt.sourceCommit -ne $pin.sourceCommit -or $baseReceipt.buildRunID -ne $pin.buildRunId -or $baseReceipt.sha256 -ne $pin.apkSha256 -or $baseReceipt.versionCode -ne $pin.versionCode -or $baseReceipt.contentHash -ne $pin.manifestSha256){throw 'Immutable base receipt/source/content differs'}
          $env:FENGSHEN_CONTENT_BASE_APK=$base[0].FullName
          $goldenPin=(Get-Content ci/golden-nanhai-content.json -Raw|ConvertFrom-Json).iteration.base
          $golden=@(Get-ChildItem artifacts/golden-base/*-release.apk)
          $goldenReceipt=Get-Content artifacts/golden-base/apk-receipt.json -Raw|ConvertFrom-Json
          if($golden.Count -ne 1 -or (Get-FileHash $golden[0].FullName).Hash.ToLowerInvariant() -ne $goldenPin.apkSha256 -or $goldenReceipt.sourceCommit -ne $goldenPin.sourceCommit -or $goldenReceipt.buildRunID -ne $goldenPin.buildRunId -or $goldenReceipt.contentHash -ne $goldenPin.manifestSha256){throw 'Historical golden source/hash/receipt differs'}
          $env:FENGSHEN_GOLDEN_BASE_APK=$golden[0].FullName
          $worldGoldenPin=(Get-Content ci/golden-world-f0-content.json -Raw|ConvertFrom-Json).iteration.base
          $worldGolden=@(Get-ChildItem artifacts/world-golden-base/*-release.apk)
          $worldGoldenReceipt=Get-Content artifacts/world-golden-base/apk-receipt.json -Raw|ConvertFrom-Json
          if($worldGolden.Count -ne 1 -or (Get-FileHash $worldGolden[0].FullName).Hash.ToLowerInvariant() -ne $worldGoldenPin.apkSha256 -or $worldGoldenReceipt.sourceCommit -ne $worldGoldenPin.sourceCommit -or $worldGoldenReceipt.buildRunID -ne $worldGoldenPin.buildRunId -or $worldGoldenReceipt.contentHash -ne $worldGoldenPin.manifestSha256){throw 'Historical world fault golden source/hash/receipt differs'}
          $env:FENGSHEN_WORLD_F0_BASE_APK=$worldGolden[0].FullName
          ./build-ci.ps1 -VersionCode $env:VERSION_CODE -VersionName $env:VERSION_NAME -ContentApk $base[0].FullName -RuntimeTests
          if($LASTEXITCODE -ne 0){throw 'Cloud build failed'}
          $receipt=Get-Content artifacts/ci/apk-receipt.json -Raw|ConvertFrom-Json
          $receipt|Add-Member sourceCommit $env:GITHUB_SHA
          $receipt|Add-Member buildRunID $env:GITHUB_RUN_ID
          $receipt|ConvertTo-Json|Set-Content artifacts/ci/apk-receipt.json -Encoding utf8NoBOM
          "### Signed APK ready for review`nVersion: $($receipt.versionName) / $($receipt.versionCode)`nSHA-256: $($receipt.sha256)`nContent: $($receipt.contentVersion) / $($receipt.contentHash)`nNo server upload performed."|Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Retain verified downloadable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-signed-apk
          path: |
            artifacts/ci/*-release.apk
            artifacts/ci/apk-receipt.json
            artifacts/ci/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-unit-test-results
          path: android/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the isolated instrumentation APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-runtime-test-apk
          path: android/app/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error
          retention-days: 14
  verify-base:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'verify-base'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an immutable trusted main base build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN_ID: ${{ inputs.base_build_run_id }}
          BASE_SHA256: ${{ inputs.base_sha256 }}
        run: |
          if($env:BASE_RUN_ID -notmatch '^[0-9]+$' -or $env:BASE_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Invalid base review identifiers'}
          $raw=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BASE_RUN_ID"
          if($LASTEXITCODE -ne 0){throw 'Cannot read source build'}
          $r=$raw|ConvertFrom-Json
          if($r.status -ne 'completed' -or $r.conclusion -ne 'success' -or $r.event -ne 'workflow_dispatch' -or $r.head_branch -ne 'main' -or $r.path -ne '.github/workflows/android-build.yml'){throw 'Untrusted base build'}
          $r.head_sha|Set-Content artifacts-base-commit.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-signed-apk
          path: artifacts/base
          run-id: ${{ inputs.base_build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify and restore the base using existing transport
        env:
          BASE_RUN_ID: ${{ inputs.base_build_run_id }}
          BASE_SHA256: ${{ inputs.base_sha256 }}
        run: |
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'APK verification tools unavailable'}
          $apks=@(Get-ChildItem artifacts/base/*-release.apk)
          if($apks.Count -ne 1){throw 'Expected exactly one base APK'}
          $receipt=Get-Content artifacts/base/apk-receipt.json -Raw|ConvertFrom-Json
          $baseCommit=(Get-Content artifacts-base-commit.txt -Raw).Trim()
          if($receipt.sourceCommit -ne $baseCommit -or $receipt.buildRunID -ne $env:BASE_RUN_ID -or $receipt.sha256 -ne $env:BASE_SHA256 -or (Get-FileHash $apks[0].FullName).Hash.ToLowerInvariant() -ne $env:BASE_SHA256){throw 'Base receipt or byte provenance mismatch'}
          python tools/ci_apk.py verify --base-only --apk $apks[0].FullName --output artifacts/base/base-verified.json --code $receipt.versionCode --name $receipt.versionName
          if($LASTEXITCODE -ne 0){throw 'Base signature/package/version/content verification failed'}
          $verified=Get-Content artifacts/base/base-verified.json -Raw|ConvertFrom-Json
          if($verified.sha256 -ne $receipt.sha256 -or $verified.sizeBytes -ne $receipt.sizeBytes -or $verified.contentHash -ne $receipt.contentHash){throw 'Base verification differs from build receipt'}
          python tools/ci_apk.py restore --base-only --apk $apks[0].FullName
          if($LASTEXITCODE -ne 0){throw 'Trusted base restoration failed'}
          python -m unittest discover -s tests -p test_ci_apk.py
          if($LASTEXITCODE -ne 0){throw 'Content transport safety regression failed'}
      - name: Retain verification receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-base-verification
          path: artifacts/base/base-verified.json
          if-no-files-found: error
          retention-days: 14
  android-capability:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'verify-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe existing Android runtime tools without creating a device
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          sdk=pathlib.Path(os.environ.get('ANDROID_HOME','/nonexistent'))
          adb=shutil.which('adb') or str(sdk/'platform-tools/adb')
          emulator=sdk/'emulator/emulator'
          avds=[]
          if emulator.is_file():
              r=subprocess.run([str(emulator),'-list-avds'],capture_output=True,text=True,timeout=20)
              if r.returncode==0: avds=r.stdout.splitlines()
          print('ANDROID_CAPABILITY: '+json.dumps(dict(adb=pathlib.Path(adb).is_file(),emulator=emulator.is_file(),avds=avds,kvmReadable=os.access('/dev/kvm',os.R_OK),kvmWritable=os.access('/dev/kvm',os.W_OK))))
          PY

  runtime:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'build' && inputs.runtime_tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-signed-apk
          path: artifacts/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-runtime-test-apk
          path: artifacts/runtime-test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-signed-apk
          path: artifacts/runtime-base
          run-id: ${{ needs.build.outputs.reviewed_upgrade_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and run the exact candidate in one isolated AVD
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          bash ci/run-town02-runtime.sh
      - name: Retain only isolated test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-town02-runtime-evidence
          path: |
            artifacts/town02-runtime/*.json
            artifacts/town02-runtime/test*.txt
            artifacts/checkpoint-ui/world-f0-*
            artifacts/checkpoint-ui/world-north-*
            artifacts/checkpoint-ui/world-west-*
            artifacts/checkpoint-ui/world-village1-*
            artifacts/checkpoint-ui/town02-ci-*
            artifacts/checkpoint-ui/touch-ux-*
            artifacts/checkpoint-ui/nanhai-*
            artifacts/checkpoint-ui/mobile-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain small Nanhai screenshot and state index for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-nanhai-checkpoints
          path: |
            artifacts/checkpoint-ui/nanhai-*.png
            artifacts/checkpoint-ui/nanhai-*.json
            artifacts/checkpoint-ui/nanhai-*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain the real route-entry clip separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-nanhai-entry-clip
          path: artifacts/nanhai-review-clips/entry/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the real ending and external-restart clips separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-nanhai-final-clips
          path: artifacts/nanhai-review-clips/final/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain mobile battle and growth screenshots separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-mobile-play-checkpoints
          path: |
            artifacts/checkpoint-ui/touch-ux-town01-*.png
            artifacts/checkpoint-ui/world-f0-*.json
            artifacts/checkpoint-ui/world-f0-force-stop-restored.png
            artifacts/checkpoint-ui/world-north-*.json
            artifacts/checkpoint-ui/world-north-force-stop-restored.png
            artifacts/checkpoint-ui/touch-ux-world-*.png
            artifacts/checkpoint-ui/touch-ux-world-*.json
            artifacts/checkpoint-ui/mobile-*.png
            artifacts/checkpoint-ui/mobile-*.json
            artifacts/checkpoint-ui/nanhai-mobile-*.png
            artifacts/checkpoint-ui/*-normal-test.txt
            artifacts/town02-runtime/test*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain bounded original world continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-checkpoints
          path: |
            artifacts/checkpoint-ui/touch-ux-world-touch-step-failure.png
            artifacts/checkpoint-ui/touch-ux-world-touch-step-failure.json
            artifacts/world-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-north-*.png
            artifacts/checkpoint-ui/touch-ux-world-north-*.json
            artifacts/checkpoint-ui/world-north-*.json
            artifacts/checkpoint-ui/world-north-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain bounded original world-west continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-west-checkpoints
          path: |
            artifacts/world-west-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-west-*.png
            artifacts/checkpoint-ui/touch-ux-world-west-*.json
            artifacts/checkpoint-ui/world-west-*.json
            artifacts/checkpoint-ui/world-west-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain bounded original world-village1 continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-village-services-checkpoints
          path: |
            artifacts/world-village1-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-village1-*.png
            artifacts/checkpoint-ui/touch-ux-world-village1-*.json
            artifacts/checkpoint-ui/world-village1-*.json
            artifacts/checkpoint-ui/world-village1-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain bounded original North palace and pearl evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-north-palace-checkpoints
          path: |
            artifacts/world-north-palace-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-north-palace-*.png
            artifacts/checkpoint-ui/touch-ux-world-north-palace-*.json
            artifacts/checkpoint-ui/world-north-palace-*.json
            artifacts/checkpoint-ui/world-north-palace-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain bounded original cave story and cold restart evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-cave85-checkpoints
          path: |
            artifacts/world-cave85-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-cave85-*.png
            artifacts/checkpoint-ui/touch-ux-world-cave85-*.json
            artifacts/checkpoint-ui/world-cave85-*.json
            artifacts/checkpoint-ui/world-cave85-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain bounded original East palace and party continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-world-east-palace-checkpoints
          path: |
            artifacts/world-east-palace-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-east-palace-*.png
            artifacts/checkpoint-ui/touch-ux-world-east-palace-*.json
            artifacts/checkpoint-ui/world-east-palace-*.json
            artifacts/checkpoint-ui/world-east-palace-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain scoped Hell and village2 normal checkpoints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fengshen-world-hell-village2-checkpoints
          path: |
            artifacts/world-hell-village2-review-clips/*
            artifacts/checkpoint-ui/touch-ux-world-hell-village2-*.png
            artifacts/checkpoint-ui/touch-ux-world-hell-village2-*.json
            artifacts/checkpoint-ui/world-hell-village2-*.json
            artifacts/checkpoint-ui/world-hell-village2-normal-test.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain scoped first hall normal battle and restart checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fengshen-world-first-hall-checkpoints
          path: |
            artifacts/checkpoint-ui/touch-ux-world-first-hall-*.png
            artifacts/checkpoint-ui/touch-ux-world-first-hall-*.json
            artifacts/checkpoint-ui/world-first-hall-recording.json
            artifacts/checkpoint-ui/world-first-hall-*-test.txt
            artifacts/world-first-hall-review-clips/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain scoped second hall normal battle and restart checkpoints
