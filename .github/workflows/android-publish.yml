name: Android approved server upload
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish uploads a reviewed APK; inspect only reads runtime diagnostics'
        type: choice
        options: [publish, inspect]
        default: publish
        required: true
      build_run_id:
        description: 'Successful Android cloud build run ID (same main commit)'
        required: false
      expected_sha256:
        description: 'Exact reviewed APK SHA-256 from that build'
        required: false
      runtime_evidence_run_id:
        description: 'Optional read-only isolated App failure-log extraction during inspect; never a publish input'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: fengshen-production-release
  cancel-in-progress: false
jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Approve the authorized Fengshen deployment
        env:
          GH_TOKEN: ${{ secrets.FENGSHEN_DEPLOY_REVIEW_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          OPERATION: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Configure repository Secret FENGSHEN_DEPLOY_REVIEW_TOKEN with Actions read and Deployments write permissions.' >&2
            exit 1
          fi
          if [[ "$OPERATION" != inspect && "$OPERATION" != publish ]]; then
            echo 'Unknown operation; no approval submitted.' >&2
            exit 1
          fi
          if [[ "$OPERATION" == publish ]]; then
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ || ! "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Invalid reviewed build identifiers; no approval submitted.' >&2
            exit 1
          fi
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          jq -e --arg commit "$GITHUB_SHA" '
            .status == "completed" and .conclusion == "success" and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .head_sha == $commit and .path == ".github/workflows/android-build.yml"
          ' <<< "$build" >/dev/null
          build_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs")
          jq -e '[.jobs[] | select(.name == "build" and .status == "completed" and .conclusion == "success")] | length == 1' <<< "$build_jobs" >/dev/null
          jq -e '[.jobs[] | select(.name == "runtime" and .status == "completed" and .conclusion == "success")] | length == 1' <<< "$build_jobs" >/dev/null
          fi
          for attempt in $(seq 1 120); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments")
            target=$(jq '[.[] | select(.environment.name == "fengshen-production")]' <<< "$pending")
            count=$(jq 'length' <<< "$target")
            if [[ "$count" == 1 ]]; then
              jq -e '.[0].current_user_can_approve == true' <<< "$target" >/dev/null
              environment_id=$(jq '.[0].environment.id' <<< "$target")
              jq -n --argjson id "$environment_id" --arg build "$BUILD_RUN_ID" --arg hash "$EXPECTED_SHA256" --arg operation "$OPERATION" \
                '{environment_ids:[$id],state:"approved",comment:(if $operation == "inspect" then "User-authorized read-only Fengshen runtime inspection; no APK publication or release registration" else "User-authorized Fengshen release; trusted main build " + $build + "; reviewed APK SHA-256 " + $hash end)}' \
                > "$RUNNER_TEMP/fengshen-review.json"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/pending_deployments" \
                --input "$RUNNER_TEMP/fengshen-review.json" --jq 'map({id:.id,environment:.environment,sha:.sha})'
              echo 'Fengshen production environment approved through the existing reviewer policy.'
              exit 0
            fi
            if [[ "$count" != 0 ]]; then
              echo 'Ambiguous production environments; no approval submitted.' >&2
              exit 1
            fi
            sleep 3
          done
          echo 'Production environment did not become reviewable; no approval submitted.' >&2
          exit 1
  publish:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: windows-2022
    timeout-minutes: 20
    environment: fengshen-production
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful trusted build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          if($env:BUILD_RUN_ID -notmatch '^[0-9]+$' -or $env:EXPECTED_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Invalid review identifiers'}
          $run=gh run view $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --json conclusion,status,event,headSha,headBranch,workflowName,jobs
          if($LASTEXITCODE -ne 0){throw 'Cannot read source build'}
          $r=$run|ConvertFrom-Json
          if($r.conclusion -ne 'success' -or $r.status -ne 'completed' -or $r.event -ne 'workflow_dispatch' -or $r.headBranch -ne 'main' -or $r.headSha -ne $env:GITHUB_SHA -or $r.workflowName -ne 'Android cloud build'){throw 'Only a successful reviewed main build at this commit may publish'}
          $successfulBuildJobs=@($r.jobs|Where-Object {$_.name -eq 'build' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success'})
          if($successfulBuildJobs.Count -ne 1){throw 'Base verification/capability runs are not APK builds'}
          $runtimeJobs=@($r.jobs|Where-Object {$_.name -eq 'runtime' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success'})
          if($runtimeJobs.Count -ne 1){throw 'Actual APK operation and covering-upgrade gate is required'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-signed-apk
          path: artifacts/ci
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-town02-runtime-evidence
          path: artifacts/runtime-review
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Prepare existing publisher dependencies
        run: |
          npm ci --prefix server --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'SSH bridge dependencies failed'}
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'SDK installation failed'}
          ./ci/install-ossutil.ps1
      - name: Verify reviewed bytes before obtaining upload credentials
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          ./ci/check-reviewed-apk.ps1 -ExpectedSha256 $env:EXPECTED_SHA256 -BuildRunID $env:BUILD_RUN_ID
      - name: Inspect, publish exact APK and update existing two-version retention
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: kubernetes-fleetpilot
          ALIYUN_OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          ALIYUN_OSS_PUBLIC_BASE_URL: https://kubernetes-fleetpilot.oss-cn-beijing.aliyuncs.com
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PASS: ${{ secrets.REMOTE_PASS }}
        run: |
          ./check-runtime.ps1
          $inspection=Get-Content reports/runtime-preflight.json -Raw|ConvertFrom-Json -AsHashtable
          if($inspection.result.status -notin @('NO_ISSUES_OBSERVED','NO_DATA') -or -not $inspection.result.retention.allowedReleases){throw 'Runtime inspection unavailable or unresolved current errors; upload prohibited'}
          $apk=@(Get-ChildItem artifacts/ci/*-release.apk)
          if($apk.Count -ne 1){throw 'Expected exactly one reviewed APK'}
          ./publish-apk.ps1 -ApkPath $apk[0].FullName
          if($LASTEXITCODE -ne 0){throw 'Publication incomplete'}
          ./check-runtime.ps1 -Stage postflight
          $post=Get-Content reports/runtime-postflight.json -Raw|ConvertFrom-Json -AsHashtable
          if($post.result.status -notin @('NO_ISSUES_OBSERVED','NO_DATA')){throw 'Published APK verified, but postflight unavailable or reports errors; investigate before reporting delivery'}
      - name: Retain publication receipts (no raw diagnostic logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-publication-receipts
          path: |
            artifacts/published/current.json
            artifacts/published/previous.json
            artifacts/ci/apk-receipt.json
          if-no-files-found: ignore
          retention-days: 30
  inspect:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'inspect'
    runs-on: windows-2022
    timeout-minutes: 10
    environment: fengshen-production
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Prepare existing read-only diagnostic bridge
        run: |
          npm ci --prefix server --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'SSH bridge dependencies failed'}
      - name: Validate an optional isolated runtime evidence source
        if: inputs.runtime_evidence_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.runtime_evidence_run_id }}
        run: |
          if($env:EVIDENCE_RUN_ID -notmatch '^[0-9]+$'){throw 'Invalid diagnostic run identifier'}
          $raw=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:EVIDENCE_RUN_ID"
          if($LASTEXITCODE -ne 0){throw 'Cannot read isolated diagnostic source'}
          $r=$raw|ConvertFrom-Json
          if($r.status -ne 'completed' -or $r.event -ne 'workflow_dispatch' -or $r.head_branch -ne 'main' -or $r.path -ne '.github/workflows/android-build.yml'){throw 'Not an isolated main build workflow source'}
      - name: Read optional isolated runtime artifact without publishing
        if: inputs.runtime_evidence_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fengshen-town02-runtime-evidence
          path: artifacts/runtime-diagnostic
          run-id: ${{ inputs.runtime_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Keep only bounded isolated App assertion logs
        if: inputs.runtime_evidence_run_id != ''
        run: |
          New-Item artifacts/runtime-assertions -ItemType Directory -Force|Out-Null
          $files=@(Get-ChildItem artifacts/runtime-diagnostic -Recurse -File|Where-Object {$_.Name -match '^[a-zA-Z0-9_-]+-normal-test\.txt$|^test[a-zA-Z0-9_-]+\.txt$'})
          if($files.Count -gt 100){throw 'Unexpected assertion log count'}
          foreach($file in $files){
            if($file.Length -gt 1MB){throw 'Assertion log size exceeded'}
            Copy-Item $file.FullName (Join-Path artifacts/runtime-assertions $file.Name)
            if($file.Name -like '*-normal-test.txt'){Get-Content $file.FullName -Tail 100}
          }
      - name: Retain isolated assertion diagnostics separately
        if: inputs.runtime_evidence_run_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-runtime-assertion-diagnostics
          path: artifacts/runtime-assertions/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Read current diagnostics without changing releases or data
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PASS: ${{ secrets.REMOTE_PASS }}
        run: |
          ./check-runtime.ps1 -SummaryOnly
          $report=Get-Content reports/runtime-preflight.json -Raw|ConvertFrom-Json -AsHashtable
          if($report.result.status -notin @('NO_ISSUES_OBSERVED','ISSUES_FOUND','NO_DATA')){throw 'Runtime query unavailable; no health conclusion'}
      - name: Retain only sanitized runtime summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fengshen-runtime-summary
          path: reports/runtime-preflight.json
          if-no-files-found: ignore
          retention-days: 14
